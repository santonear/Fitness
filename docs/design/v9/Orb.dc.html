<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>芽芽悬浮助手</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.orb-spin{animation:orbspin 6s linear infinite}
.orb-pop{animation:orbpop .35s cubic-bezier(.34,1.56,.64,1) both}
.orb-breath{animation:orbbreath 2.8s ease-in-out infinite}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbpop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes orbbreath{0%,100%{box-shadow:0 0 0 0 var(--orb-glow)}50%{box-shadow:0 0 0 8px transparent}}
@media (prefers-reduced-motion: reduce){.orb-spin,.orb-pop,.orb-breath{animation:none}}
</style>
</helmet>
<div data-orb-root="1" style="position: relative; width: 390px; height: 844px; pointer-events: none; font-family: Noto Sans SC, system-ui, sans-serif">
<div style="{{pos}}">
<sc-if value="{{showTip}}" hint-placeholder-val="{{true}}">
<div class="orb-pop" style="{{tipStyle}}">
<span style="flex: 1">{{tip}}</span>
<button type="button" aria-label="收起提示" onClick="{{closeTip}}" style="{{tipClose}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div class="orb-pop" role="dialog" aria-label="芽芽快捷助手" style="{{panel}}">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 800">芽芽</span>
<button type="button" aria-label="收起" onClick="{{toggle}}" style="{{iconBtn}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<p style="{{panelText}}">{{tip}}</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{acts}}" as="a" hint-placeholder-count="3"><button type="button" onClick="{{a.go}}" style="{{a.style}}"><span>{{a.label}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></sc-for>
</div>
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{chat}}" style="{{chatBtn}}">打开对话</button>
<button type="button" onClick="{{tuck}}" style="{{tuckBtn}}">靠边</button>
</div>
</div>
</sc-if>
<button type="button" aria-label="芽芽助手，按住可上下拖动" onPointerDown="{{down}}" style="{{orb}}">
<span class="orb-spin" aria-hidden="true" style="{{ring}}"></span>
<span aria-hidden="true" style="{{core}}"></span>
<span style="position: relative; display: flex"><dc-import name="Yaya" pose="head" tk="{{tk}}" px="{{58}}" hint-size="58px,58px"></dc-import></span>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tk":{"editor":"enum","options":["pop","vivid","gentle","data","fire"],"default":"pop"},"tip":{"editor":"text","default":"今天 32 分钟，要不要先热身 5 分钟？"},"actions":{"editor":null},"onChat":{"editor":null},"top":{"editor":"int","default":560},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
down(e) {
const root = e.currentTarget.closest('[data-orb-root]');
if (!root) return;
const r = root.getBoundingClientRect();
const k = r.height / 844;
const st = this.state || {};
const y0 = e.clientY; const top0 = st.y == null ? (this.props.top || 560) : st.y;
let moved = false;
const mv = (ev) => {
const dy = (ev.clientY - y0) / k;
if (Math.abs(dy) > 4 || Math.abs(ev.clientX - e.clientX) > 4) moved = true;
if (!moved) return;
const x = (ev.clientX - r.left) / k;
this.setState({ y: Math.max(110, Math.min(740, top0 + dy)), side: x < 195 ? 'left' : 'right', drag: true, tucked: false });
};
const up = () => {
window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
if (!moved) { const s = this.state || {}; this.setState({ open: !s.open, tucked: false, tipClosed: true, drag: false }); }
else this.setState({ drag: false });
};
window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
}
renderVals() {
const st = this.state || {};
const tk = this.props.tk || 'pop';
const T = {
pop: { a: '#FFB534', g: 'conic-gradient(#FFE38F, #FFB534, #FFFFFF, #FFE38F)', dark: false },
vivid: { a: '#E0745A', g: 'conic-gradient(#E0745A, #F6C29A, #8FB39A, #E0745A)', dark: false },
gentle: { a: '#8BBF2A', g: 'conic-gradient(#C5E84A, #6FA52A, #C5E84A)', dark: false },
data: { a: '#2EDCD0', g: 'conic-gradient(#3BF0D0, #1A9BC4, #3BF0D0)', dark: true },
fire: { a: '#FF3B4A', g: 'conic-gradient(#FF6A6A, #B3121F, #FF6A6A)', dark: true }
}[tk] || { a: '#9B5CF6', g: 'conic-gradient(#F25CD9, #5B8CFF, #F25CD9)', dark: false };
const dark = T.dark;
const y = st.y == null ? (this.props.top || 560) : st.y;
const right = (st.side || 'right') === 'right';
const open = !!st.open; const tucked = !!st.tucked;
const ink = dark ? '#F2F5FA' : '#15151A'; const sub = dark ? 'rgba(242,245,250,.72)' : '#55555E';
const glass = dark ? 'rgba(20,26,40,.72)' : 'rgba(255,255,255,.78)';
const brd = dark ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.9)';
const sh = dark ? '0 18px 40px rgba(0,0,0,.45)' : '0 18px 40px rgba(40,30,90,.18)';
const set = (o) => () => this.setState(o);
const actions = this.props.actions || ['只有 20 分钟', '今天有点累', '换个地方练'];
const onChat = this.props.onChat || (() => {});
return {
tk: tk, tip: this.props.tip || '', down: (e) => this.down(e),
open: open, showTip: !open && !st.tipClosed && !tucked,
pos: 'position: absolute; top: ' + y + 'px; ' + (right ? 'right: 12px' : 'left: 12px') + '; display: flex; flex-direction: ' + (right ? 'row-reverse' : 'row') + '; align-items: flex-end; gap: 10px; pointer-events: auto; transition: ' + (st.drag ? 'none' : 'top .35s cubic-bezier(.16,1,.3,1), transform .35s cubic-bezier(.16,1,.3,1)') + '; transform: translateX(' + (tucked ? (right ? '46px' : '-46px') : '0') + ')',
orb: 'position: relative; width: 68px; height: 68px; flex: none; border-radius: 50%; border: 0; padding: 0; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center; background: transparent; filter: drop-shadow(' + (dark ? '0 10px 18px rgba(0,0,0,.5)' : '0 10px 18px rgba(60,40,120,.25)') + '); opacity: ' + (tucked ? 0.75 : 1),
ring: 'position: absolute; inset: 0; border-radius: 50%; background: ' + T.g + '; box-shadow: 0 0 18px ' + T.a + '66',
core: 'position: absolute; inset: 3px; border-radius: 50%; background: ' + (dark ? 'radial-gradient(circle at 35% 30%, #3A4560, #0E1320 70%)' : 'radial-gradient(circle at 35% 30%, #FFFFFF, #E6E3F2 70%)') + '; box-shadow: inset 0 2px 6px rgba(255,255,255,.6), inset 0 -6px 12px rgba(0,0,0,.18)',
tipStyle: 'max-width: 210px; padding: 10px 8px 10px 14px; border-radius: ' + (right ? '18px 18px 4px 18px' : '18px 18px 18px 4px') + '; background: ' + glass + '; border: 1px solid ' + brd + '; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: ' + sh + '; color: ' + ink + '; font-size: 13px; line-height: 1.5; display: flex; gap: 6px; align-items: flex-start; margin-bottom: 18px',
tipClose: 'width: 24px; height: 24px; flex: none; border: 0; border-radius: 50%; background: transparent; color: ' + sub + '; display: flex; align-items: center; justify-content: center; cursor: pointer',
closeTip: set({ tipClosed: true }),
panel: 'width: 248px; box-sizing: border-box; padding: 14px; border-radius: 24px; background: ' + glass + '; border: 1px solid ' + brd + '; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: ' + sh + '; color: ' + ink + '; display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px',
panelText: 'margin: 0; font-size: 14px; line-height: 1.55; color: ' + sub,
iconBtn: 'width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: ' + sub + '; display: flex; align-items: center; justify-content: center; cursor: pointer',
acts: actions.map((label) => ({ label: label, go: onChat, style: 'min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid ' + (dark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.06)') + '; background: ' + (dark ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.7)') + '; color: ' + ink + '; display: flex; align-items: center; justify-content: space-between; font: 500 14px/1 Noto Sans SC, sans-serif; cursor: pointer' })),
chatBtn: 'flex: 1; height: 42px; border: 0; border-radius: 12px; background: ' + T.g.replace('conic-gradient', 'linear-gradient(135deg,').replace('(135deg,(', '(135deg, ') + '; color: ' + (tk === 'gentle' || tk === 'data' ? '#0B1A10' : '#FFFFFF') + '; font: 700 14px/1 Noto Sans SC, sans-serif; cursor: pointer',
tuckBtn: 'height: 42px; padding: 0 14px; border: 0; border-radius: 12px; background: ' + (dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.05)') + '; color: ' + ink + '; font: 500 14px/1 Noto Sans SC, sans-serif; cursor: pointer',
chat: () => { this.setState({ open: false }); onChat(); },
tuck: set({ open: false, tucked: true }),
toggle: set({ open: !open })
};
}
}
</script>
</body>
</html>
