<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness 后台 · 交互原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500&family=Archivo:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF;--bg-m:radial-gradient(120% 40% at 50% 0%,#E6EEE9 0%,#DDE6E0 60%);
  --surface:#FFFFFF;--surface-2:#F2F5F1;--line:#C8D5CD;--line-2:#E3EAE6;
  --ink:#16201C;--muted:#4F5F58;--nav:#16201C;--nav-ink:#DCE5E0;--nav-muted:#9DB0A8;--nav-active:#26332E;
  --primary:#3E6B5C;--primary-ink:#F2F5F1;--link:#1F5F4A;
  --ok:#2F7A55;--warn:#9A6B12;--warn-ink:#7A5410;--alert:#B3261E;--alert-bg:#F7E9E6;--alert-line:#E2B7AF;--alert-ink:#8E2A1E;
  --gold:#C7A867;--celadon:#8FB3A5;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--f-display:"Noto Serif SC","Songti SC",serif;
  --f-num:"Archivo","Noto Sans SC",sans-serif;--f-money:"Cormorant Garamond","Noto Serif SC",serif;
  --press:cubic-bezier(.18,1.36,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}a:hover{color:#123D30}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.money{font-family:var(--f-money);font-variant-numeric:lining-nums tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.press{transition:transform .42s var(--press),box-shadow .42s var(--press)}
.press:active:not(:disabled){transform:scale(.96)}
@media (prefers-reduced-motion:reduce){.press{transition:none}.press:active:not(:disabled){transform:none}}

/* 原型工具栏（不属于产品界面） */
.proto{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 12px;background:#0E1412;color:#C9D6D0;font-size:12px}
.proto button{min-height:28px;padding:0 10px;border-radius:6px;border:1px solid #3A4842;background:#1D2724;color:#E8EEEA;cursor:pointer}

/* 外壳 */
.shell{display:flex;min-height:calc(100vh - 40px)}
.rail{display:none}
.main{flex:1;min-width:0;padding:20px 16px 96px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:#E6EDE8;border-top:1px solid var(--line)}
.tabbar button{min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-radius:12px}
.tabbar button[aria-current=page]{color:var(--ink);font-weight:700}
.tabbar small{font-size:11px;font-weight:400}
.tabbar .hot{color:var(--alert-ink)}
@media (max-width:959px){body{background:#DDE6E0}.main{background:var(--bg-m)}}
@media (min-width:960px){
  .shell{min-height:calc(100vh - 40px)}
  .rail{display:flex;flex-direction:column;gap:20px;flex:0 0 232px;background:var(--nav);color:var(--nav-ink);padding:22px 14px;position:sticky;top:40px;height:calc(100vh - 40px);overflow:auto}
  .tabbar{display:none}
  .main{padding:28px 32px 48px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{color:#fff;display:block}.brand small{color:var(--nav-muted)}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--nav-ink);text-align:left;cursor:pointer}
.rail nav button[aria-current=page]{background:var(--nav-active);color:#fff}
.rail nav button:hover{background:#1F2A26}
.badge{border-radius:999px;padding:0 8px;font-size:12px;line-height:20px}
.badge.alert{background:var(--alert);color:#fff}.badge.gold{color:var(--gold)}.badge.muted{color:var(--nav-muted)}
.rail .foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--nav-muted)}

/* 通用 */
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font-size:24px;font-weight:700;line-height:1.3}
@media (max-width:959px){h1{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:.04em}}
h2{margin:0;font-size:17px}
h3{margin:0;font-size:15px}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:959px){.card{background:var(--surface-2);border:1px solid var(--line);border-radius:24px;padding:18px}}
.card.hero{background:linear-gradient(180deg,#fff 0%,#F2F5F1 100%);box-shadow:0 18px 40px -22px rgba(30,60,48,.45);border:0}
@media (min-width:960px){.card.hero{border-radius:16px}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>*{flex:1 1 320px}
.cols>.wide{flex:3 1 520px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:500}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btn.link{border-color:transparent;background:none;color:var(--link);padding:0 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:959px){.btn{border-radius:999px;min-height:48px}.btn.big{min-height:56px;font-size:16px;width:100%}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface-2)}
.pill.alert{background:var(--alert-bg);border-color:var(--alert-line);color:var(--alert-ink)}
.pill.warn{background:#FBF3E2;border-color:#E8D3A6;color:var(--warn-ink)}
.pill.ok{background:#E7F2EC;border-color:#BBD8C7;color:#1F5F3D}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.dot.alert{background:var(--alert)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.info{background:var(--celadon)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);font-size:14px}
textarea.input{padding:10px 12px;min-height:80px;resize:vertical}
.tablebox{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 8px;text-align:left;vertical-align:top;border-top:1px solid var(--line-2)}
thead th{border-top:0;color:var(--muted);font-size:13px;font-weight:500;padding-top:4px}
tbody th{font-weight:500}

/* 状态五格 */
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.status>div{background:#fff;border-radius:14px;padding:14px 16px;border-top:4px solid var(--ok)}
.status .k{font-size:13px;color:var(--muted)}.status .v{font-size:20px;font-weight:700}.status .h{font-size:12px;color:var(--muted)}
.status>.alert{border-top-color:var(--alert)}.status .alert .v{color:var(--alert)}
.status>.warn{border-top-color:var(--warn)}.status .warn .v{color:var(--warn-ink)}
@media (max-width:959px){.status{display:none}}
.pills-m{display:none;flex-wrap:wrap;gap:8px}
@media (max-width:959px){.pills-m{display:flex}}

/* 待办 */
.todo-list{display:flex;flex-direction:column}
.todo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.todo:first-child{border-top:0}
.todo .t{flex:1 1 260px;min-width:0}
.todo .t b{display:block}
.todo-cards{display:none;flex-direction:column;gap:14px}
@media (max-width:959px){.todo-list{display:none}.todo-cards{display:flex}}
.todo-cards .card .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.todo-cards .card .acts.one{grid-template-columns:1fr}

/* 图表 */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;min-width:0}
.bar span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.meter{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.c1{background:#1F5F4A}.c2{background:#8FB3A5}.c3{background:#C7A867}.c4{background:#4F5F58}

/* 流水 */
.flow{list-style:none;margin:0;padding:0}
.flow li{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line-2)}
.flow li:first-child{border-top:0}
.flow .when{flex:0 0 92px;color:var(--muted)}
.user-layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.user-layout .list{flex:1 1 240px;max-width:300px}
.user-layout .detail{flex:999 1 420px;min-width:0}
.user-layout .ops{flex:1 1 280px;max-width:340px}
@media (max-width:959px){.user-layout .list,.user-layout .ops{max-width:none}}
.ulist{display:flex;flex-direction:column;gap:2px}
.ulist button{text-align:left;min-height:56px;padding:8px 12px;border-radius:10px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column}
.ulist button[aria-current=true]{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.opcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.opcard.danger{border-color:var(--alert-line)}
.opcard.danger b{color:var(--alert-ink)}

/* 开关 */
.switch{position:relative;width:52px;height:32px;border-radius:999px;border:0;background:#B9C6BF;cursor:pointer;flex:0 0 52px}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.switch:disabled{opacity:.45;cursor:not-allowed}

/* 更多（手机） */
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.more button{min-height:88px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);text-align:left;padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}

/* 对话框与提示 */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(22,32,28,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.dialog{width:min(480px,100%);background:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dialog ul{margin:0;padding-left:18px;color:var(--muted)}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:959px){.scrim{align-items:flex-end;padding:0}.dialog{border-radius:24px 24px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.dialog .acts{display:grid;grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:24px;z-index:70;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
@media (max-width:959px){.toast{bottom:96px}}
.toast[hidden]{display:none}
.banner{border-radius:12px;padding:10px 14px;background:#FBF3E2;border:1px solid #E8D3A6;color:var(--warn-ink);font-size:13px}
.diff{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-size:13px}
.diff .h{color:var(--muted)}
.diff del{color:var(--alert-ink)}.diff ins{color:#1F5F3D;text-decoration:none;font-weight:500}
</style>
</head>

  if(S.ledgerMismatch)T.push({lv:'alert',title:'账本需要核对',text:`9 月有 ${S.ledgerMismatch} 笔预留没对上供应商账单。核对完成前，所有新的 AI 调用都会暂停。`,acts:[['逐笔核对','go:ledger','primary']]});
  if(S.smokeFailed)T.push({lv:'alert',title:'生产冒烟测试未通过',text:'v8.0.9 的"备份与恢复"检查没有通过。可以回滚到 v8.0.8。',acts:[['查看发布','go:flags','primary']]});
  if(pct>=100)T.push({lv:'alert',title:'本月预算已用完',text:'新的 AI 请求已改用本地规则。',acts:[['查看费用','go:coach','primary']]});
  else if(pct>=80)T.push({lv:'warn',title:`本月预算已用 ${pct}%`,text:'含待核算预留。用完后新的 AI 请求会改用本地规则。',acts:[['查看费用','go:coach','primary']]});
  S.users.filter(u=>u.unknown).forEach(u=>T.push({lv:'warn',title:'一次额度恢复结果未知',text:`用户 ${sid(u.id)} 的请求超时，服务端可能已执行。重试会复用同一个请求编号，不会重复恢复。`,acts:[['看流水','user:'+u.id,''],['重试同一次','retry:'+u.id,'primary']]}));
  S.flags.filter(f=>f.sensitive&&f.preview&&!f.prod).forEach(f=>T.push({lv:'warn',title:`「${f.name}」等你确认开启`,text:'预览环境已通过。涉及健康数据或外发，生产开启需要你确认。',acts:[['查看并确认','go:flags','']]}));
  const pend=S.apps.filter(a=>a.state==='pending');
  if(pend.length){const old=Math.max(...pend.map(a=>NOW-a.at));T.push({lv:old>48*H?'warn':'info',title:`${pend.length} 份试用申请等待审核`,text:old>48*H?`最早一份已等 ${Math.floor(old/D)} 天。`:'都是 48 小时内提交的。',acts:[['逐个审核','go:apps','']]});}
  return T;
}

let lastFocus=null;
function dialog({title,body,consequences,confirm,danger,onConfirm,cancel='取消'}){
  lastFocus=document.activeElement;
  $('#dialog').innerHTML=`<h2 id="dlgTitle">${title}</h2>${body?`<div class="small">${body}</div>`:''}${consequences?`<ul class="small">${consequences.map(c=>`<li>${c}</li>`).join('')}</ul>`:''}<div class="acts"><button type="button" class="btn press" data-dlg="cancel">${cancel}</button>${confirm?`<button type="button" class="btn press ${danger?'danger':'primary'}" data-dlg="ok">${confirm}</button>`:''}</div>`;
  $('#scrim').hidden=false;$('#dialog').querySelector('[data-dlg=cancel]').focus();
  $('#dialog').onclick=e=>{const b=e.target.closest('[data-dlg]');if(!b)return;closeDlg();if(b.dataset.dlg==='ok')onConfirm&&onConfirm();};
}
function closeDlg(){$('#scrim').hidden=true;lastFocus&&lastFocus.focus&&lastFocus.focus();}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeDlg()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeDlg()});
function stepUp(fn){
  if(Date.now()-S.stepUpAt<5*60e3)return fn();
  dialog({title:'需要重新验证身份',body:'这是一项危险操作。你的登录已超过 5 分钟，请先重新验证，再继续。取消则不做任何改动。',confirm:'重新验证（演示）',onConfirm:()=>{S.stepUpAt=Date.now();toast('已重新验证');setTimeout(fn,150)}});
}

    export:()=>{if(a1==='ledger'){download('fitness-ledger-2026-10.csv',[['日期','任务','预留(元)','状态'],...S.ledger.map(r=>[r.date,r.task,(r.amt/100).toFixed(2),r.state])]);audit('导出账本 CSV','2026-10')}else{download('fitness-audit.csv',[['时间','操作','对象'],...S.audit.map(a=>[fmt(a[0]),a[1],a[2]])]);audit('导出操作记录 CSV')}toast('已导出 CSV')},
    settle:()=>{const r=S.ledger.find(x=>x.id===a1);dialog({title:'按供应商账单核算这一笔？',body:`<label class="field">账单金额（元）<input class="input num" id="bill" type="number" step="0.01" value="${(r.amt/100).toFixed(2)}"></label>`,consequences:['以账单金额记为实际费用','释放这笔预留'],confirm:'核算',onConfirm:()=>{const v=Math.round(parseFloat($('#bill')?.value||r.amt/100)*100)||r.amt;if(r.state==='mismatch')S.ledgerMismatch--;r.state='settled';S.budget.reserved=Math.max(0,S.budget.reserved-r.amt);S.budget.spent+=v;audit('按账单核算',r.id);toast(S.ledgerMismatch?'已核算':'全部对上了，AI 调用已恢复');render()}})},
    unassign:()=>{const r=S.ledger.find(x=>x.id===a1);if(r.state==='mismatch')S.ledgerMismatch--;r.state='unassigned';audit('标为未归属',r.id);toast('已标为未归属，继续保留');render()},
    flag:()=>{const f=S.flags[+a1],env=a2;const on=!f[env];
      const apply=()=>{f[env]=on;if(env==='preview'&&!on)f.prod=false;f.by='你';f.at=Date.now();audit(`${on?'开启':'关闭'}开关「${f.name}」（${env==='prod'?'生产':'预览'}）`);toast(on?'已开启，1 分钟内生效':'已关闭，1 分钟内生效');render()};
      if(!on)return apply();
      if(env==='prod'&&f.sensitive)return stepUp(()=>dialog({title:`在生产环境开启「${f.name}」？`,body:esc(f.desc),consequences:['所有用户都会看到这项功能','涉及健康数据或外发：只存在用户设备，默认不发送给芽芽','出现问题可以随时一键关闭'],confirm:'开启',onConfirm:apply}));
      apply()},
    rollback:()=>stepUp(()=>dialog({title:`回滚到 ${S.release.prev}？`,consequences:['生产切换到上一版本的代码','不回退数据库结构，用户数据不受影响','回滚后自动重跑冒烟测试，结果会出现在待办'],confirm:'回滚',danger:true,onConfirm:()=>{const r=S.release;[r.cur,r.prev]=[r.prev,r.cur];[r.curAt,r.prevAt]=[Date.now(),r.curAt];audit('回滚到 '+r.cur);toast('已回滚，冒烟测试全部通过');render()}})),
    saveCfg:()=>{const nv={};let bad=[];document.querySelectorAll('[data-cfg]').forEach(i=>{const v=parseFloat(i.value);if(!(v>=+i.min&&v<=+i.max))bad.push(i.closest('label').firstChild.textContent);nv[i.dataset.cfg]=v});
      if(bad.length){toast('超出合法范围：'+bad[0]);return}
      const L={quota:['每月计划生成默认次数','次'],limit:['月预算上限','元'],reserve:['单次请求预留','元'],concurrency:['并发上限','个'],retention:['申请保留天数','天']};
      const ch=Object.keys(nv).filter(k=>nv[k]!==S.config[k]);if(!ch.length){toast('没有改动');return}
      stepUp(()=>dialog({title:'保存运行配置？',body:`<div class="diff"><span class="h">项目</span><span class="h">改前</span><span class="h">改后</span>${ch.map(k=>`<span>${L[k][0]}</span><del class="num">${S.config[k]} ${L[k][1]}</del><ins class="num">${nv[k]} ${L[k][1]}</ins>`).join('')}</div>`,consequences:['只影响之后的请求','不改写已有用量和费用','可以在修改历史中恢复'],confirm:'保存',onConfirm:()=>{const v=S.configHist[0].v+1;S.configHist.unshift({v,at:Date.now(),by:'你',chg:ch.map(k=>`${L[k][0]} ${S.config[k]} → ${nv[k]}`).join('；')});Object.assign(S.config,nv);if(ch.includes('limit'))S.budget.limit=Math.round(nv.limit*100);audit('修改运行配置 v'+v);toast('已保存为 v'+v);render()}}))},
    cfgRestore:()=>stepUp(()=>dialog({title:`恢复到配置 v${a1}？`,consequences:['生成一个新版本，内容与 v'+a1+' 相同','只影响之后的请求'],confirm:'恢复',onConfirm:()=>{const v=S.configHist[0].v+1;S.configHist.unshift({v,at:Date.now(),by:'你',chg:'恢复为 v'+a1+' 的内容'});audit('恢复运行配置到 v'+a1);toast('已恢复，当前为 v'+v);render()}})),
    notify:()=>{S.notify[a1]=!S.notify[a1];render()},
    testPush:()=>toast(S.notify.installed?'测试提醒已发送':'测试提醒已发送。如果没收到，请先把后台添加到主屏幕'),
    announce:()=>{const t=$('#an').value.trim(),d=Math.min(7,Math.max(1,+$('#ad').value||1));if(!t){toast('请填写公告内容');return}if(/你应该|你必须|失败|[!！]/.test(t)){toast('公告文字没有通过话术检查，请换一种说法');return}
      dialog({title:'发布维护公告？',body:`<div class="banner">${esc(t)}</div>`,consequences:[`显示 ${d} 天，到期自动撤下`,'用户可以关闭；训练中不显示'],confirm:'发布',onConfirm:()=>{S.announce={text:t,from:Date.now(),to:Date.now()+d*D};audit('发布维护公告');toast('公告已发布');render()}})},
    unannounce:()=>{S.announce=null;audit('撤下维护公告');toast('公告已撤下');render()},
    addNote:()=>{const t=$('#nn').value.trim();if(!t)return;S.notes[$('#nk').value].push(t);toast('已添加');render()},
    delNote:()=>{S.notes[a1].splice(+a2,1);render()}
  };
  A[act]&&A[act]();
});
document.addEventListener('input',e=>{const n=e.target.dataset.note;if(n)S.appNotes[n]=e.target.value;const q=e.target.dataset.quiet;if(q)S.notify[q]=e.target.value;
  if(e.target.id==='uq'){const v=e.target.value.trim().replace('·','');document.querySelectorAll('.ulist button').forEach(b=>b.hidden=!b.dataset.act.slice(5).startsWith(v))}});
document.addEventListener('change',e=>{const p=e.target.dataset.pick;if(p&&e.target.value){S.appNotes[p]=e.target.value;const inp=document.querySelector(`[data-note="${p}"]`);if(inp)inp.value=e.target.value;e.target.value=''}
  const pi=e.target.dataset.prompt;if(pi!==undefined){const p=S.prompts[+pi],v=e.target.value;if(v===p.cur)return;e.target.value=p.cur;stepUp(()=>dialog({title:`${p.task}切换到 ${v}？`,consequences:['之后的请求使用该版本','可以随时切回','评测报告会标注所用版本'],confirm:'切换',onConfirm:()=>{p.cur=v;audit(`${p.task}提示词切换到 ${v}`);toast('已切换');render()}}))}});
$('#pReset').onclick=()=>{S=seed();render();toast('已恢复示例数据')};
$('#pStale').onclick=()=>{S.stepUpAt=0;toast('已模拟：下一次危险操作会要求重新验证')};
render();
</script>
</body>
</html>
