version: severity-v1
definitions:
  hard: 必须满足。违反即算法失败；不可满足时只能是健康阻断（gate），绝不能生成空计划或违规计划。
  target: 尽量满足，计入质量分（0–1，按 weight 加权、按偏离程度线性扣分）。不满足不算失败，必要时写 notice。
  advice: 能满足就满足；满足不了既不扣分也不失败，可写一条温和 notice。
  mechanic: 算法参数/默认值/模板/公式，用于生成，不作为校验项。
  copy: 文案，原样使用。
  meta: 手册约定。
overrides:
  goal.params.*:
    time_share: 只作目标：每类在原区间基础上各向外放宽到 [0.30, 0.70]，按偏离程度线性扣分；任何情况下不得因时间占比使计划为空或失败
  balance.week.carry_ground:
    applies_when: 用户器械满足任一 carry 或 locomotion_ground 动作，且 rt_days ≥ 2；否则跳过并不提示
  older.template.balance_required:
    rule: 老年人模块：可用训练日 ≥3 时为硬性（每周 ≥3 天含平衡）；可用日 <3 时每次课都含 ≥1 个平衡动作并作为目标计分
  session.cooldown.stretch:
    exempt: ≤20 分钟的课程免除；放不下时用 1 个 30–60 秒拉伸替代
  goal.floor.all:
    exempt: 每周 1 天或单次 ≤20 分钟时，每肌群每周 ≥2 次降为目标计分，不作失败
  dose.sets_week.*:
    rule: 区间下限为目标；时间不够时按时间优先，记 notice "本周训练量低于建议，可增加天数或时长"
  duration.fit.bounds:
    value: 硬性：预计时长在目标 ±20% 以内（10 分钟课允许 8–14 分钟）
  duration.fit.tolerance:
    value: 目标：±10% 以内满分，10%–20% 线性扣分
  week.recovery.spacing:
    rule: 同一肌群高强度训练间隔 ≥48 小时为目标；用户只选连续日期时允许，按偏离扣分
