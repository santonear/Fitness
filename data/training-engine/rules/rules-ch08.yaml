# 第 8 章 有氧、日常活动与减脂 —— 机器规则 v0.1（2026-10-14）
# 与 ch08-aerobic-activity.md 一一对应。强度上限先受 safety.* 约束。

- id: aerobic.target.weekly
  chapter: 8
  type: default
  value:
    moderate_equiv_min_week: 150
    stretch_min_week: 300
    formula: moderate_min + 2 * vigorous_min
    vigorous_multiplier: 2
    cap_min_week: null
    above_stretch: recovery_overuse_checks
  evidence: A
  sources: [E01:WHO20, E01:PAG18, E01:UKCMO]
  note: 1:2 换算是 MET 约定，非精确等价

- id: aerobic.bout.any_length
  chapter: 8
  type: default
  value: {min_bout_minutes: 1, min_intensity: moderate, ten_minute_rule: false}
  evidence: A
  sources: [E01:WHO20, E01:PAG18]

- id: aerobic.progression.ramp
  chapter: 8
  type: limit
  value:
    applies_when: current_moderate_equiv_min_week < 150
    week1_min: max(60, current_moderate_equiv_min_week)
    week1_floor_min: 60
    weekly_increase_max_pct: 10
    applies_above_150: true
    distribute_increase_across_modalities: true
    rejected_alternatives: {week1_floor_min: [60, 90]}
  evidence: C
  sources: [E01:PAG18, E01:WHO20, E01:UKCMO]
  note: 工程选择，待教练审核；10% 规则未核实

- id: aerobic.copy.every_minute
  chapter: 8
  type: copy
  zh: 每一分钟都算数。从你现在的水平开始，一点点加量就好。
  en: Every minute counts. Start where you are and build up a little at a time.
  evidence: A
  sources: [E01:WHO20, E01:PAG18, E01:UKCMO]

- id: aerobic.modality.any_counts
  chapter: 8
  type: default
  value:
    count_rule: by_rpe_not_impact
    examples: [brisk_walking, cycling, swimming, stair_climbing, dancing, rowing, marching]
    low_impact_substitution_keeps_rpe: true
  evidence: A
  sources: [E01:PAG18, E01:UKCMO]
  note: 低冲击等效性无专门荟萃分析，属 C 级推断

- id: aerobic.intensity.talk_test
  chapter: 8
  type: copy
  value: {moderate: talk_not_sing, vigorous: few_words}
  zh:
    moderate: 还能聊天，但唱不了歌。
    vigorous: 只能一次说几个词，就得停下换气。
  en:
    moderate: You can talk, but not sing.
    vigorous: You can only say a few words before pausing for breath.
  evidence: A
  sources: [E01:CDC-INT, E01:PAG18, E01:BOK22]

- id: aerobic.intensity.rpe_scale
  chapter: 8
  type: default
  value:
    scale: [0, 10]
    light_max: 4
    moderate: [5, 6]
    vigorous: [7, 8]
    hiit_work: [8, 9]
    hiit_recovery: [2, 4]
    block_fields: [target_rpe_0_10, talk_cue]
    borg_6_20_in_app: false
  evidence: A
  sources: [E01:CDC-INT, E01:PAG18, E01:BOK22]

- id: aerobic.intensity.mets
  chapter: 8
  type: default
  value:
    light: {met_max_exclusive: 3.0, counts: false}
    moderate: {met: [3.0, 5.9], multiplier: 1}
    vigorous: {met_min: 6.0, multiplier: 2}
    examples: {brisk_walking: moderate, jogging: vigorous, stair_climbing: vigorous}
  evidence: A
  sources: [E01:PAG18]

- id: aerobic.intensity.hrmax
  chapter: 8
  type: formula
  value:
    hrmax_bpm: 208 - 0.7 * age
    constants: {intercept: 208, slope: 0.7}
    rounding: integer
    error_note_bpm: 10
    error_can_exceed_bpm: 20
    pct_hrmax_zones_enabled: false   # 区间未核实，默认关闭
    pct_hrmax_unverified: {moderate: [64, 76], vigorous: [77, 93]}
    hide_hr_if: [beta_blockers, heart_condition]
    primary_cue: rpe_and_talk_test
  evidence: B
  sources: [E01:TANAKA01, E01:CDC-HR]
  note: CDC-HR 区间待核实，未核实前不显示心率区间

- id: hiit.gate.unlock
  chapter: 8
  type: gate
  value:
    all_of:
      - clearance_state_in: [none_needed, confirmed_vigorous]
      - max_intensity: vigorous
      - consecutive_regular_weeks_min: 4      # safety.unlock.regular_week
      - no_symptom_reports_weeks: 4
      - age45_advisory_acked_if_required: true  # safety.age45.vigorous_advisory
      - pregnant: false
      - postpartum: module_permits
    older_adult: {age_min: 65, max_impact: 1}
    default_state: locked
  evidence: C
  sources: [E01:COCH26, E01:MART20, E01:FRANK20, E01:PARQ23, E01:ROG12, E01:WEW18]
  note: 工程选择，待教练审核；ROG12、WEW18 待核实

- id: hiit.dose.default
  chapter: 8
  type: template
  value:
    sessions_per_week: [1, 2]
    min_rest_days_between: 1
    intervals_start: [4, 6]
    work_seconds: [30, 60]
    work_rpe_start: 8
    recovery_to_work_ratio_min: 1.0
    recovery_rpe: [2, 4]
    warmup_minutes: {min: 5, default: 5, max: 10}
    cooldown_minutes: 5
    progression_order: [add_interval, raise_work_rpe]
    max_intervals_added_per_week: 1
    interval_cap_before_rpe_increase: 10
    work_rpe_after_cap: [8, 9]
    all_out_sprints: advanced_opt_in_only
  evidence: C
  sources: [E01:COCH26, E01:MART20, E01:FRANK20]
  note: 工程选择，待教练审核；加组速度与 10 组上限无来源

- id: hiit.credit.minutes
  chapter: 8
  type: formula
  value:
    moderate_equiv: 2 * work_min + recovery_min_if_rpe_ge_5 + warmup_cooldown_min_if_rpe_ge_5
    recovery_counts_if_rpe_min: 5
    warmup_cooldown_counts_if_rpe_min: 5
  evidence: C
  sources: [E01:WHO20, E01:PAG18, E01:CDC-INT]
  note: 工程选择；只计达到强度的时间

- id: aerobic.snack.option
  chapter: 8
  type: template
  value:
    bout_minutes_max: 5
    bouts_per_day_min: 2
    days_per_week: [3, 7]
    credit: by_actual_intensity
    vigorous_bursts: {minutes: [1, 2], requires_max_intensity: vigorous}
    replaces_strength: false
  evidence: B
  sources: [E03:Rodriguez-2026, E01:STAM22, E01:WHO20]
  note: STAM22 为观察性研究

- id: steps.target.daily
  chapter: 8
  type: default
  value:
    by_age:
      - {age_max_exclusive: 60, steps: [8000, 10000]}
      - {age_min: 60, steps: [7000, 8000]}
    optional_goal_steps: 10000
    show_any_increase_positive: true
  evidence: B
  sources: [E01:PALUCH22, E01:DING25]
  note: DING25 待核实；计步设备差异大

- id: steps.progression.increment
  chapter: 8
  type: limit
  value:
    baseline: median_last_7_days_or_user_estimate
    review_every_weeks: 2
    condition: days_met_target_last_7 >= 5
    increment_steps_per_day: 1000
    else: hold
    stop_at: target_range_upper
    rejected_alternatives: {increment_steps_per_day: [1000, 2000], review_every_weeks: [1, 2]}
  evidence: C
  sources: [E01:PALUCH22, E01:DING25]
  note: 工程选择，待教练审核；取证据范围保守端

- id: steps.credit.mvpa
  chapter: 8
  type: limit
  value:
    steps_auto_convert_to_minutes: false
    counts_as_aerobic_if: [user_logged_brisk_walk_talk_test_moderate, device_detected_moderate_walk]
    steps_category: neat
  evidence: C
  sources: [E01:PALUCH22, E01:EKE16, E01:PAG18]
  note: 工程选择；只有中等强度快走计入有氧分钟

- id: fatloss.plan.structure
  chapter: 8
  type: template
  applies:
    goal: [fat_loss]
  value:
    aerobic_min_week_start: 150
    strength_sessions_week: [2, 3]
    aerobic_progress_to_min_week: [200, 300]
    progress_over_weeks: 12
    weekly_increase_limit: aerobic.progression.ramp
    cardio_only_plan: false
    nutrition_prompt: required
    thresholds_info: {prevent_gain_min_week: [150, 250], clinically_significant_loss_min_week_gt: 250, large_loss_or_maintenance_min_week_gt: 300}
    rejected_alternatives: {progress_over_weeks: [8, 12]}
  evidence: A
  sources: [E01:DONN09, E01:PAG18, E01:JAYEDI24, E01:WEW22, E01:WILLIS12]

- id: fatloss.expectation.copy
  chapter: 8
  type: copy
  value: {kg_per_extra_30_min_week: 0.52, waist_cm_per_extra_30_min_week: 0.56, kg_at_150_min_week: 2.8, kg_at_300_min_week: 4.2, personal_prediction: false}
  zh: 在只增加有氧运动的研究里，平均每周多做 30 分钟，体重约多减 0.5 kg、腰围约少 0.5 cm；每周 150 分钟平均约减 2.8 kg，300 分钟约减 4.2 kg。饮食对减重的作用更大，每个人差别也很大。即使体重没变，运动对健康的好处依然存在。
  en: In studies that added aerobic exercise alone, each extra 30 minutes a week led to about 0.5 kg more weight loss and about 0.5 cm off the waist on average; 150 minutes a week averaged about 2.8 kg and 300 minutes about 4.2 kg. Diet plays a bigger role, and results vary a lot between people. Even if your weight doesn't change, exercise still benefits your health.
  evidence: B
  sources: [E01:JAYEDI24, E01:DONN09]
  note: 不做个人化减重预测

- id: fatloss.spot_reduction.ban
  chapter: 8
  type: limit
  value:
    banned_claims: [spot_fat_loss, burn_belly_fat, slim_specific_body_part]
    applies_to: [exercise_names, tags, rationale_text, push_notifications]
    on_user_targets_body_part: {show_copy: fatloss.copy.spot_reduction, plan: whole_body_fat_loss}
  evidence: B
  sources: [E01:RC21]

- id: fatloss.copy.spot_reduction
  chapter: 8
  type: copy
  zh: 脂肪从哪里减少，我们没法自己选。练核心能让你更有力量；全身活动量加上饮食调整，才会让脂肪减少。
  en: You can't choose where fat comes off. Core training builds strength; overall activity plus your eating habits is what reduces fat.
  evidence: B
  sources: [E01:RC21]

- id: fatloss.hiit.optional
  chapter: 8
  type: default
  applies:
    goal: [fat_loss]
  value:
    hiit_default: false
    may_replace_part_of_weekly_aerobic: true
    requires: hiit.gate.unlock
    credit: hiit.credit.minutes
    claim_hiit_burns_more_fat: false
  evidence: B
  sources: [E01:VIANA19, E01:COCH26]

- id: sedentary.break.nudge
  chapter: 8
  type: default
  value:
    offered_at_onboarding: true
    default_enabled: false
    interval_minutes_default: 60
    interval_minutes_range: [30, 60]
    respect_quiet_hours: true
    suggested_activity_minutes: [1, 3]
    suggested_activity: [stand, walk, light_movement]
  evidence: C
  sources: [E01:WHO20, E01:PAG18, E01:UKCMO]
  note: 工程选择，待教练审核；指南未给间隔

- id: sedentary.high_sitting.target
  chapter: 8
  type: trigger
  value:
    when: sitting_hours_per_day > 8
    show_stretch_goal_min_week: 300
    info_offset_moderate_min_per_day: [60, 75]
    change_ramp: false
  evidence: B
  sources: [E01:WHO20, E01:EKE16]
  note: 60–75 分钟为观察性数据
