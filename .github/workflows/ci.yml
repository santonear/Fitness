name: Local MVP checks

on:
  push:
    branches: [main, v8/integration]
  pull_request:
  # The production release reuses these checks on the exact commit it ships.
  workflow_call:
  # Safari (webkit) runs once a day, 02:00 Beijing, and on manual runs.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Bo 2026-10-22: pull requests and pushes test Chrome (chromium) only; webkit
# joins in the daily scheduled run so a Safari regression still shows within a day.
env:
  PW_PROJECT: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '--project=chromium' || '' }}
  PW_BROWSERS: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'chromium' || 'chromium webkit' }}

concurrency:
  group: fitness-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Bo 2026-10-22: a push to main runs only the quick checks (the pull request already ran
# everything, and the nightly run covers main); a pull request runs the browser groups its
# changed files need (tools/ci-scope.mjs). Browser groups start right away instead of
# waiting for the quick checks; verify still requires every group that ran.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ github.event_name == 'push' && 'quick' || steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/ci-scope.mjs

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node --test tools/v8/check.test.mjs
      - run: node tools/v8/check.mjs
      - run: node tools/check-layers.mjs
      # Same functional group as tools/training-engine/test.mjs. The complete
      # diagnostic group runs in engine-audit, and verify requires both jobs.
      - run: npm run typecheck
      - run: npm test -- --exclude tests/training-engine/diagnostic.test.ts
      - run: npm run build
      - run: npm run engine:check
      - run: node tools/check-coach-client-boundary.mjs
      - name: Collect all browser suites before installing browsers
        run: |
          npx playwright test --list > /dev/null
          npx playwright test --list --config playwright.trial.config.ts > /dev/null
          npx playwright test --list --config tests/e2e/v8-mainline.config.ts > /dev/null
          npx playwright test --list --config tests/e2e/v8-plan-review.config.ts > /dev/null
          npx playwright test --list --config playwright.v8-coach.config.ts > /dev/null
          npx playwright test --list --config tests/e2e/training-engine.config.ts > /dev/null

  engine-audit:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    # 10 minutes was too tight: on 2026-10-22 slow runners took over 10 minutes and the job was killed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Build a fresh receipt outside Vitest, on this same source/input/runtime.
      # Original diagnostic assertions and their timeout remain unchanged.
      - run: npm run engine:full
      - run: npm test -- tests/training-engine/diagnostic.test.ts

  browser-main:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","webkit"]' || '["chromium"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Keep downloaded browsers between runs; on slow runner days the download alone took 5-11 minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium-webkit' || 'chromium' }}
      - run: npx playwright install --with-deps $PW_BROWSERS
      # Execute every existing test once; independent runners keep the job deadline unchanged.
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=2 --retries=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-main-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  browser-followup:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Keep downloaded browsers between runs; on slow runner days the download alone took 5-11 minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium-webkit' || 'chromium' }}
      - run: npx playwright install --with-deps $PW_BROWSERS
      - run: npx playwright test --config tests/e2e/followup-finish.config.ts $PW_PROJECT --retries=1
      - run: npm run build && npx playwright test --config followup-pwa.config.ts --retries=1

  browser-flows:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Keep downloaded browsers between runs; on slow runner days the download alone took 5-11 minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium-webkit' || 'chromium' }}
      - run: npx playwright install --with-deps $PW_BROWSERS
      - run: npx playwright test --config playwright.trial.config.ts $PW_PROJECT --retries=1
      - run: npx playwright test --config tests/e2e/v8-mainline.config.ts --retries=1
      - run: npx playwright test --config tests/e2e/mainline-polish.config.ts --retries=1
      - run: npx playwright test --config tests/e2e/v8-plan-review.config.ts --retries=1
      - run: npx playwright test --config playwright.v8-coach.config.ts --retries=1

  browser-engine:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Keep downloaded browsers between runs; on slow runner days the download alone took 5-11 minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/training-engine.config.ts --retries=1

  browser-admin:
    needs: changes
    if: needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'admin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Keep downloaded browsers between runs; on slow runner days the download alone took 5-11 minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/admin/integration.playwright.config.ts --retries=1
      - run: npx playwright test --config tests/admin/releases-ui.config.ts --retries=1
      - run: npx playwright test --config tests/admin/quality.playwright.config.ts --retries=1

  # Preserve the existing required check name and fail closed: checks must pass and every
  # group must have passed or been skipped on purpose by the scope decision.
  verify:
    if: always()
    needs: [changes, checks, engine-audit, browser-main, browser-followup, browser-flows, browser-engine, browser-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const bad = Object.entries(needs).filter(([name, job]) =>
              ["changes", "checks"].includes(name) ? job.result !== "success" : !["success", "skipped"].includes(job.result));
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            if (bad.length) process.exit(1);'
