name: Local MVP checks

on:
  push:
    branches: [main, v8/integration]
  pull_request:
  # The production release reuses these checks on the exact commit it ships.
  workflow_call:
  # Safari (webkit) runs once a day, 02:00 Beijing, and on manual runs.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Bo 2026-10-22: pull requests and pushes test Chrome (chromium) only; webkit
# joins in the daily scheduled run so a Safari regression still shows within a day.
env:
  PW_PROJECT: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '--project=chromium' || '' }}
  PW_BROWSERS: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && 'chromium' || 'chromium webkit' }}

concurrency:
  group: fitness-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node --test tools/v8/check.test.mjs
      - run: node tools/v8/check.mjs
      # Same functional group as tools/training-engine/test.mjs. The complete
      # diagnostic group runs in engine-audit, and verify requires both jobs.
      - run: npm run typecheck
      - run: npm test -- --exclude tests/training-engine/diagnostic.test.ts
      - run: npm run build
      - run: npm run engine:check
      - run: node tools/check-coach-client-boundary.mjs
      - name: Collect all browser suites before installing browsers
        run: |
          npx playwright test --list > /dev/null
          npx playwright test --list --config playwright.trial.config.ts > /dev/null
          npx playwright test --list --config tests/e2e/v8-mainline.config.ts > /dev/null
          npx playwright test --list --config tests/e2e/v8-plan-review.config.ts > /dev/null
          npx playwright test --list --config playwright.v8-coach.config.ts > /dev/null
          npx playwright test --list --config tests/e2e/training-engine.config.ts > /dev/null

  engine-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      # Build a fresh receipt outside Vitest, on this same source/input/runtime.
      # Original diagnostic assertions and their timeout remain unchanged.
      - run: npm run engine:full
      - run: npm test -- tests/training-engine/diagnostic.test.ts

  browser-main:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","webkit"]' || '["chromium"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      - run: npx playwright install --with-deps $PW_BROWSERS
      # Execute every existing test once; independent runners keep the job deadline unchanged.
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=2 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-main-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  browser-followup:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      - run: npx playwright install --with-deps $PW_BROWSERS
      - run: npx playwright test --config tests/e2e/followup-finish.config.ts $PW_PROJECT
      - run: npm run build && npx playwright test --config followup-pwa.config.ts

  browser-flows:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      - run: npx playwright install --with-deps $PW_BROWSERS
      - run: npx playwright test --config playwright.trial.config.ts $PW_PROJECT
      - run: npx playwright test --config tests/e2e/v8-mainline.config.ts
      - run: npx playwright test --config tests/e2e/mainline-polish.config.ts
      - run: npx playwright test --config tests/e2e/v8-plan-review.config.ts
      - run: npx playwright test --config playwright.v8-coach.config.ts

  browser-engine:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/training-engine.config.ts

  browser-admin:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run engine:prepare
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/admin/integration.playwright.config.ts
      - run: npx playwright test --config tests/admin/releases-ui.config.ts
      - run: npx playwright test --config tests/admin/quality.playwright.config.ts

  # Preserve the existing required check name and fail closed if any group fails.
  verify:
    if: always()
    needs: [checks, engine-audit, browser-main, browser-followup, browser-flows, browser-engine, browser-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          CHECKS: ${{ needs.checks.result }}
          AUDIT: ${{ needs.engine-audit.result }}
          MAIN: ${{ needs.browser-main.result }}
          FOLLOWUP: ${{ needs.browser-followup.result }}
          FLOWS: ${{ needs.browser-flows.result }}
          ENGINE: ${{ needs.browser-engine.result }}
          ADMIN: ${{ needs.browser-admin.result }}
        run: test "$CHECKS" = success && test "$AUDIT" = success && test "$MAIN" = success && test "$FOLLOWUP" = success && test "$FLOWS" = success && test "$ENGINE" = success && test "$ADMIN" = success
