name: Roll back Fitness production

# One-click rollback of the production Worker. Waits for approval on the
# cloudflare-production environment. D1 migrations are not reverted.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version id to restore (leave empty for the previous version)
        required: false
        default: ''
      reason:
        description: Why are we rolling back?
        required: true

permissions:
  contents: read

concurrency:
  group: fitness-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require an approver on cloudflare-production
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/check-environment.mjs cloudflare-production
      - name: Roll back only from main
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Rollbacks run from main only (got $GITHUB_REF)."
            exit 1
          fi
          if [ -n "$VERSION_ID" ] && ! [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "version_id must be a Worker version id."
            exit 1
          fi

  rollback:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-production
      url: https://fitness.initdevl.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Roll back the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          npx wrangler deployments status --config wrangler.production.jsonc
          npx wrangler rollback $VERSION_ID --config wrangler.production.jsonc --message "$REASON" --yes
          npx wrangler deployments status --config wrangler.production.jsonc
      - name: Smoke test production
        run: node tools/release/smoke.mjs https://fitness.initdevl.workers.dev
