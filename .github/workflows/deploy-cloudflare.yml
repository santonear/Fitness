name: Publish Fitness to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitness-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/fitness-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npx playwright test --config playwright.guided-live.config.ts
      - name: Publish the verified build
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
