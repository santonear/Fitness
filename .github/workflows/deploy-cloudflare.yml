name: Publish Fitness to Cloudflare

# Production release. Manual, main only, and every run waits for approval on
# the cloudflare-production environment before it touches D1 or the Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitness-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require an approver on cloudflare-production
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/check-environment.mjs cloudflare-production
      - name: Release only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production releases run from main only (got $GITHUB_REF)."
            exit 1
          fi

  tests:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-production
      url: https://fitness.initdevl.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run build
      - name: Record the version that is live now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### Live before this release"
            echo '```'
            npx wrangler deployments status --config wrangler.production.jsonc
            echo '```'
            echo "If this release needs undoing, run **Roll back Fitness production** with a version id from above."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Provision the approved separate operations database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release/provision-ops.mjs
      - name: Show pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list ADMIN_DB --remote --config wrangler.production.jsonc
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ADMIN_DB --remote --config wrangler.production.jsonc
      - name: Deploy the verified build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc --message "release ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}"
      - name: Smoke test production
        run: node tools/release/smoke.mjs https://fitness.initdevl.workers.dev
