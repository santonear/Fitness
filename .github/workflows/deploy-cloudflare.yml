name: Publish Fitness to Cloudflare

# Production release. Manual and main only: Bo starts each run himself (the
# private repo cannot require an environment reviewer, Bo 2026-10-22).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitness-cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the cloudflare-production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/check-environment.mjs cloudflare-production
      - name: Release only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production releases run from main only (got $GITHUB_REF)."
            exit 1
          fi

  # Bo 2026-10-22: the full browser suites already ran on the pull request for
  # this exact code, so a release runs only the quick checks before deploying;
  # the smoke test after deploy checks the live site.
  tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node tools/v8/check.mjs
      - run: npm run typecheck
      - run: npm test -- --exclude tests/training-engine/diagnostic.test.ts
      - run: npm run build
      - run: npm run engine:check

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-production
      url: https://fitness.initdevl.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run catalog:prepare
      - run: npm run build
      - name: Record the version that is live now
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### Live before this release"
            echo '```'
            npx wrangler deployments status --config wrangler.production.jsonc
            echo '```'
            echo "If this release needs undoing, run **Roll back Fitness production** with a version id from above."
          } >> "$GITHUB_STEP_SUMMARY"
          # Machine-readable copy for the release registry. A failure only means
          # the previous version is shown as not registered (rollback disabled).
          npx wrangler deployments status --config wrangler.production.jsonc --json > "$RUNNER_TEMP/prev-deployment.json" || echo '{}' > "$RUNNER_TEMP/prev-deployment.json"
          live=$(node -e "import('./tools/release/registry.mjs').then(m=>{try{console.log(m.liveVersionId(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')))??'')}catch{console.log('')}})" "$RUNNER_TEMP/prev-deployment.json")
          if [ -n "$live" ]; then
            npx wrangler versions view "$live" --config wrangler.production.jsonc --json > "$RUNNER_TEMP/prev-version.json" || echo '{}' > "$RUNNER_TEMP/prev-version.json"
          else
            echo '{}' > "$RUNNER_TEMP/prev-version.json"
          fi
      - name: Provision the approved separate operations database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release/provision-ops.mjs
      - name: Show pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations list ADMIN_DB --remote --config wrangler.production.jsonc
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ADMIN_DB --remote --config wrangler.production.jsonc
      - name: Register this release for the admin page
        env:
          RELEASE_ENVIRONMENT: production
          RELEASE_SHA: ${{ github.sha }}
          SMOKE_ORIGIN: https://fitness.initdevl.workers.dev
        run: |
          RELEASE_SUBJECT="$(git log -1 --format=%s)" node tools/release/registry.mjs \
            --deployment "$RUNNER_TEMP/prev-deployment.json" --version "$RUNNER_TEMP/prev-version.json" \
            --out-registry "$RUNNER_TEMP/registry.json" --out-message "$RUNNER_TEMP/message.txt" --out-tag "$RUNNER_TEMP/tag.txt"
          {
            echo "### Release registry"
            echo '```json'
            cat "$RUNNER_TEMP/registry.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the verified build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The registry travels with the version it describes: the admin page and its
        # rollback guard read it, and the running Worker fills in its own version id.
        run: |
          npx wrangler deploy --config wrangler.production.jsonc \
            --message "$(cat "$RUNNER_TEMP/message.txt")" --tag "$(cat "$RUNNER_TEMP/tag.txt")" \
            --var "ADMIN_RELEASE_REGISTRY:$(cat "$RUNNER_TEMP/registry.json")"
      - name: Smoke test production
        run: node tools/release/smoke.mjs https://fitness.initdevl.workers.dev
